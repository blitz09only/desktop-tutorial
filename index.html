<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>资源加载中</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif;background:#f5f5f5;min-height:100vh;display:flex;justify-content:center;align-items:center}
.card{width:90%;max-width:380px;background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.06);overflow:hidden}
.card-img{width:100%;height:180px;display:flex;align-items:center;justify-content:center;background:#f0f0f0;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-body{padding:20px}
.card-body h2{font-size:17px;color:#222;margin-bottom:8px}
.card-body p{font-size:13px;color:#888;line-height:1.6;margin-bottom:10px}
.card-foot{padding:0 20px 20px;display:flex;justify-content:center}
.card-foot a{display:inline-block;padding:10px 36px;background:linear-gradient(135deg,#1677FF,#4096FF);color:#fff;border-radius:24px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none}
</style>
</head>
<body>
<div class="card">
<div class="card-img"><img src="product-img.png" alt=""></div>
<div class="card-body"><h2 id="t1">商品详情</h2><p>请确认信息后继续操作</p></div>
<div class="card-foot"><a id="btn" href="#" onclick="return false;">查看详情</a></div>
<p id="fallback" style="display:none;text-align:center;color:#888;font-size:12px;padding:0 20px 20px">如未自动跳转，请点击右上角 ⋯ →<br>在浏览器中打开</p>
</div>
<script>
(function(){
var h=location.hash.substring(1);
if(!h||h.length<4)return;
var u='';
try{
  var s=h.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length%4)s+='=';
  u=decodeURIComponent(Array.prototype.map.call(atob(s),function(c){return'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)}).join(''));
}catch(e){
  try{u=decodeURIComponent(h)}catch(e2){}
}
if(u&&u.indexOf('http')===0){
  var b=document.getElementById('btn');
  b.href='javascript:void(0)';
  b.removeAttribute('onclick');
  b.style.cursor='pointer';
  b.onclick=function(){
    // 尝试弹出到系统浏览器
    var w=window.open(u,'_blank');
    if(!w){
      // 如果被拦截，降级为当前页跳转
      location.href=u;
    }
    // 同时触发提示
    setTimeout(function(){
      var fb=document.getElementById('fallback');
      if(fb)fb.style.display='block';
    },800);
    return false;
  };
  b.textContent='查看详情';
}
})();
</script>
</body>
</html>
